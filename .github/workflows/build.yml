name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile "random fandom skibidi.py"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: random-fandom-skibidi-windows
          path: "dist/random fandom skibidi.exe"
